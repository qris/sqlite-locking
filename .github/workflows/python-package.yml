# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            extra_cflags: -Wno-tautological-pointer-compare
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: 12.0
      C_AND_CXX_FLAGS: |
        -Wall
        -Wextra
        -Wno-unused-parameter
        -Wno-missing-field-initializers
        -Werror
        ${{ matrix.extra_cflags }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install pdm
        CFLAGS="$C_AND_CXX_FLAGS" CXXFLAGS="$C_AND_CXX_FLAGS" pdm install
        pdm add pytest
    - name: Dump build logs
      if: always()
      run: |
        ls -la ~runner/work/sqlite-locking/sqlite-locking
        ls -la ~runner/work/sqlite-locking/sqlite-locking/.venv
        ls -la ~runner/work/sqlite-locking/sqlite-locking/.venv/bin
        cat ~runner/Library/Logs/pdm/pdm-install-*.log || true
    - name: Lint with Ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        pdm run ruff check
    - name: Test with pytest
      run: |
        # pdm run pytest -v
        $GITHUB_WORKSPACE/.venv/bin/pytest -v
    - name: Test building package distributions for PyPI
      run: pdm build
